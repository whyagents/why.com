<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" font-kerning="normal">
  <title>WHY. — X banner 1500x500</title>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=DM+Sans:wght@500;600;700&amp;family=EB+Garamond:wght@400;500&amp;display=swap");
      .display { font-family:"Cormorant Garamond", Georgia, serif; }
      .serif   { font-family:"EB Garamond", Georgia, serif; }
      .sans    { font-family:"DM Sans", Helvetica, Arial, sans-serif; }
    </style>

    <!-- the gold bloom that sits top-right across the whole product -->
    <radialGradient id="bloom" cx="0" cy="0" r="1"
      gradientTransform="translate(1210 60) scale(600 560)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a08c5a" stop-opacity=".38"/>
      <stop offset="0.55" stop-color="#a08c5a" stop-opacity=".10"/>
      <stop offset="1" stop-color="#a08c5a" stop-opacity="0"/>
    </radialGradient>

    <!-- second, colder bloom low-left to stop the ink going flat behind the avatar -->
    <radialGradient id="bloom2" cx="0" cy="0" r="1"
      gradientTransform="translate(300 470) scale(520 380)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4aa72" stop-opacity=".10"/>
      <stop offset="1" stop-color="#c4aa72" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a08c5a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a08c5a" stop-opacity="0"/>
    </linearGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="#080806"/>
  <rect width="1500" height="500" fill="url(#bloom)"/>
  <rect width="1500" height="500" fill="url(#bloom2)"/>
  <!-- the centre hairline from the site background -->
  <rect x="759" y="0" width="1" height="500" fill="#ffffff" opacity=".025"/>

  <!-- ── headline block. starts at x=400 to clear the avatar overlap ── -->
  <text class="sans" x="400" y="176" fill="#c4aa72"
    font-size="15" font-weight="700" letter-spacing="7.2">WHY.COM</text>

  <text class="display" x="400" y="272" fill="#f0ebe0"
    font-size="66" font-weight="500" letter-spacing="-1.4">Answers are cheap.</text>
  <text class="display" x="400" y="352" fill="#c4aa72"
    font-size="66" font-weight="400" font-style="italic" letter-spacing="-1.4">The next question isn’t.</text>

  <rect x="400" y="392" width="300" height="1" fill="url(#rule)"/>
  <text class="sans" x="400" y="424" fill="#aaa395"
    font-size="13" font-weight="600" letter-spacing="3.4">ASK WHY</text>

  <!-- ── the three doors, exactly as the product renders them ── -->
  <g>
    <g transform="translate(1090 138)">
      <rect width="330" height="54" rx="27" fill="#a08c5a" fill-opacity=".05"
        stroke="#a08c5a" stroke-opacity=".45"/>
      <text class="sans" x="26" y="32" fill="#c4aa72" font-size="11" font-weight="700" letter-spacing="2.6">MONEY</text>
      <text class="serif" x="112" y="34" fill="#d3cdc1" font-size="23">who gets paid?</text>
    </g>
    <g transform="translate(1090 210)">
      <rect width="330" height="54" rx="27" fill="#a08c5a" fill-opacity=".05"
        stroke="#a08c5a" stroke-opacity=".45"/>
      <text class="sans" x="26" y="32" fill="#c4aa72" font-size="11" font-weight="700" letter-spacing="2.6">POWER</text>
      <text class="serif" x="112" y="34" fill="#d3cdc1" font-size="23">who decides?</text>
    </g>
    <g transform="translate(1090 282)">
      <rect width="330" height="54" rx="27" fill="#a08c5a" fill-opacity=".05"
        stroke="#a08c5a" stroke-opacity=".45"/>
      <text class="sans" x="26" y="32" fill="#c4aa72" font-size="11" font-weight="700" letter-spacing="2.6">COST</text>
      <text class="serif" x="112" y="34" fill="#d3cdc1" font-size="23">who pays later?</text>
    </g>
  </g>

  <!-- LAUNCH DAY: swap this line for the contract address.
       Burned into the image so a scammer quoting your post cannot alter it. -->
  <!--
  <text class="sans" x="1420" y="424" text-anchor="end" fill="#aaa395"
    font-size="13" font-weight="600" letter-spacing="1.6">$WHY · CA 0000000000000000000000000000000000000000000</text>
  -->

  <rect width="1500" height="500" filter="url(#grain)" opacity=".035" style="mix-blend-mode:overlay"/>
</svg>
