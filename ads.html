<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070706">
  <title>AI-Native Advertising Demo — WHY.</title>
  <style>
    html,body{min-height:100%;margin:0;background:#070706;color:#f0ebe0}
    body{display:grid;place-items:center;font-family:Georgia,serif}
    p{color:#a08c5a;letter-spacing:.12em}
  </style>
</head>
<body>
  <p>Preparing the advertising demo…</p>
  <script>
    (async () => {
      const response = await fetch("index.html", { cache: "no-store" });
      let html = await response.text();
      const closingScript = "<" + "/script>";
      const adapterTag = '<script src="ads-demo.js?v=20260915-05" defer>' + closingScript;
      const demoStyles = `
        <style>
          .ads-demo-note{display:inline-flex;align-items:center;justify-content:center;cursor:default;opacity:.78}
          .curiosity-door.is-sponsored>span{display:inline}
          .ads-sponsor-tag{display:inline-block;margin-left:.55rem;color:#d97969;font-family:"DM Sans",sans-serif;font-size:.5rem;font-style:normal;font-weight:700;letter-spacing:.18em;line-height:1.35;text-transform:uppercase;vertical-align:middle}
          .ads-lead-card{margin:2rem 0 .35rem;padding:1.5rem 0 0;border-top:1px solid rgba(240,235,224,.12)}
          .ads-lead-eyebrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.15rem;color:var(--mid);font-family:"DM Sans",sans-serif;font-size:.54rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
          .ads-lead-bid{color:var(--mid);white-space:nowrap}
          .ads-lead-card h2{max-width:620px;margin:0 0 .45rem;color:var(--hi);font-family:"Cormorant Garamond",serif;font-size:clamp(1.65rem,3vw,2.2rem);font-weight:500;letter-spacing:-.02em;line-height:1.05}
          .ads-lead-copy{max-width:570px;margin:0 0 1.5rem;color:var(--mid);font-family:"EB Garamond",serif;font-size:1.05rem;line-height:1.45}
          .ads-lead-form{display:grid;gap:1.25rem}
          .ads-choice-field{min-width:0;margin:0;padding:0;border:0}
          .ads-choice-field legend,.ads-contact-prompt{margin:0 0 .62rem;color:rgba(240,235,224,.66);font-family:"DM Sans",sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
          .ads-choice-row{display:flex;flex-wrap:wrap;gap:.45rem}
          .ads-choice{position:relative;cursor:pointer}
          .ads-choice input{position:absolute;opacity:0;pointer-events:none}
          .ads-choice span{display:block;padding:.56rem .82rem;border:1px solid rgba(240,235,224,.24);border-radius:10px;color:var(--mid);background:transparent;font-family:"DM Sans",sans-serif;font-size:.74rem;transition:border-color .2s,color .2s,transform .2s}
          .ads-choice:hover span{border-color:rgba(240,235,224,.52);color:var(--hi);background:transparent}
          .ads-choice input:focus-visible + span{outline:1px solid var(--gold-hi);outline-offset:2px}
          .ads-choice input:checked + span{border-color:var(--hi);color:var(--hi);background:transparent;transform:translateY(-1px)}
          .ads-contact-step{display:grid;gap:.82rem;margin-top:.2rem;padding-top:1.15rem;border-top:1px solid rgba(240,235,224,.1)}
          .ads-contact-step[hidden]{display:none}
          .ads-contact-fields{display:grid;grid-template-columns:minmax(100px,.55fr) minmax(210px,1.45fr);gap:1rem}
          .ads-field{display:grid;gap:.15rem}
          .ads-field label{color:var(--dim);font-family:"DM Sans",sans-serif;font-size:.54rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
          .ads-field input{width:100%;min-height:42px;padding:.55rem 0;border:0;border-bottom:1px solid rgba(240,235,224,.2);border-radius:0;outline:0;color:var(--hi);background:transparent;font-family:"DM Sans",sans-serif;font-size:.86rem;transition:border-color .2s}
          .ads-field input:focus{border-color:var(--hi)}
          .ads-consent{display:flex;align-items:flex-start;gap:.58rem;color:var(--dim);font-size:.66rem;line-height:1.4}
          .ads-consent input{flex:0 0 auto;margin-top:.18rem;accent-color:var(--gold)}
          .ads-lead-submit{justify-self:start;min-height:42px;padding:0 1.25rem;border:1px solid rgba(240,235,224,.44);border-radius:2px;color:var(--hi);background:transparent;font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:border-color .2s,transform .2s}
          .ads-lead-submit:hover{border-color:var(--hi);transform:translateY(-1px)}
          .ads-lead-fineprint{color:var(--dim);font-size:.59rem;line-height:1.4}
          .ads-lead-success{padding:.4rem 0;color:var(--hi);font-family:"EB Garamond",serif;font-size:1.25rem;line-height:1.5}
          .ads-lead-success strong{font-weight:500}
          @media(max-width:640px){
            .ads-lead-card{margin-top:1.55rem;padding-top:1.2rem}
            .ads-contact-fields{grid-template-columns:1fr}
            .ads-lead-eyebrow{align-items:flex-start;flex-direction:column;gap:.35rem}
          }
        </style>`;
      html = html
        .replace(/(<script id="Cookiebot"[^>]*?)\s+src="[^"]+"/i, "$1")
        .replace("<body>", '<body data-ads-demo="true">')
        .replace("<title>WHY.</title>", "<title>AI-Native Advertising Demo — WHY.</title>")
        .replace("</head>", '<meta name="robots" content="noindex,nofollow">' + demoStyles + "</head>")
        .replace(/<script src="why-app\.js[^>]*><\/script>/, adapterTag + '\n  <script src="why-app.js?v=20260915-ads03" defer>' + closingScript);
      document.open();
      document.write(html);
      document.close();
    })().catch(() => {
      document.body.innerHTML = "<p>The advertising demo could not load.</p>";
    });
  </script>
</body>
</html>
