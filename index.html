  <section class="screen loading-screen" id="loadingView" hidden aria-label="Connecting the dots">
    <div class="loading-inner">
      <div class="signal-map" aria-hidden="true">
        <svg viewBox="0 0 430 180" focusable="false">
          <path class="signal-path one" pathLength="260" d="M32 138 C78 138 105 88 166 72"/>
          <path class="signal-path two" pathLength="260" d="M166 72 C224 56 252 48 302 43"/>
          <path class="signal-path three" pathLength="260" d="M302 43 C338 50 354 98 390 116"/>
          <circle class="signal-halo one" cx="32" cy="138" r="10"/>
          <circle class="signal-halo two" cx="166" cy="72" r="11"/>
          <circle class="signal-halo three" cx="302" cy="43" r="10"/>
          <circle class="signal-halo four" cx="390" cy="116" r="11"/>
          <circle class="signal-node one" cx="32" cy="138" r="4"/>
          <circle class="signal-node two" cx="166" cy="72" r="5"/>
          <circle class="signal-node three" cx="302" cy="43" r="4"/>
          <circle class="signal-node four" cx="390" cy="116" r="5"/>
          <circle class="signal-pulse" cx="0" cy="0" r="3.5"/>
        </svg>
      </div>
      <div class="signal-copy" aria-hidden="true">Connect the dots.</div>
      <button type="button" class="cancel" data-action="cancel" aria-label="Cancel search">×</button>
    </div>
  </section>

  <section class="screen answer-screen" id="answerView" hidden>
    <div class="answer-shell">
      <div class="path-status" id="pathStatus">
        <div class="path-trail" id="pathTrail" aria-label="Current path"></div>
        <button type="button" class="path-history" data-action="history" aria-label="Open history"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.2V3.6M3 8.2h4.6"/><path d="M3.6 12.4a8.4 8.4 0 1 0 2.7-6.2L3 8.2"/><path d="M12 7.6v4.8l3.2 1.9"/></svg>History</button>
      </div>
      <main class="conversation" id="conversation" aria-live="polite"></main>
    </div>
    <div class="follow-bar" id="followBar">
      <form class="follow-form" id="followForm" aria-label="Ask another WHY">
        <svg class="ic search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="M20.4 20.4 15.6 15.6"/></svg>
        <input class="follow-input" id="followInput" aria-label="Continue the question path" placeholder="Ask the next why…" autocomplete="off" maxlength="4000">
        <button class="follow-send" id="followSend" type="submit" aria-label="Send follow-up"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.4V4.6M5.6 11 12 4.6 18.4 11"/></svg></button>
      </form>
    </div>
  </section>

  <section class="screen error-screen" id="errorView" hidden><div class="error-inner"><p class="f-xs gold">Search interrupted</p><h2>That answer didn’t arrive.</h2><p id="errorMessage">Try again in a moment.</p><button type="button" data-action="retry">Try again</button></div></section>

  <div class="history-modal" id="historyModal" role="dialog" aria-modal="true" aria-labelledby="historyTitle" aria-hidden="true" inert><div class="history-box"><div class="history-head"><h2 class="display" id="historyTitle">Your paths</h2><button type="button" data-action="close-history" aria-label="Close history"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 6.5 6.5 17.5M6.5 6.5l11 11"/></svg></button></div><div class="history-stats" id="historyStats"></div><div id="selfModel"></div><div id="historyList"></div><div class="history-data-actions" aria-label="Path backup controls"><button type="button" class="history-data-action" data-action="export-paths">Export paths</button><button type="button" class="history-data-action" data-action="import-paths">Import paths</button><input id="pathImportInput" type="file" accept="application/json,.json" hidden></div><button type="button" class="history-clear" data-action="clear">Clear local history</button></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
