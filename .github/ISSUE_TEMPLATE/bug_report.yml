name: Bug report
description: Report a reproducible problem in WHY.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make the next question better. Do not include credentials, private paths, or sensitive personal content.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Ask ...
        3. Choose ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Homepage
        - Answer and three questions
        - Daily WHY
        - History or local memory
        - Netlify Function
        - Build or tests
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on Android 16
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add a screenshot or sanitized console output if useful.
